<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LE'GO Name Tags</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Creepster&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1530;
    --panel: #261d42;
    --panel-2: #31265a;
    --ink: #f4efe6;
    --muted: #b7aecf;
    --accent: #f5cf1d;
    --line: rgba(255,255,255,.12);
    --sheet: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.4px);
    background-size: 6px 6px;
    color: var(--ink);
    font: 14px/1.45 Inter, system-ui, sans-serif;
    min-height: 100vh;
  }
  .app { display: grid; grid-template-columns: 340px 1fr; min-height: 100vh; }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 22px 20px 40px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  h1 {
    font-family: Creepster, Abril Fatface, serif;
    font-weight: 400; letter-spacing: .03em;
    color: var(--accent); font-size: 34px; line-height: 1; margin: 0 0 4px;
  }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  label { display: block; font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
  input[type=text], textarea {
    width: 100%; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 15px;
  }
  textarea { min-height: 110px; resize: vertical; font-size: 13px; line-height: 1.5; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .teams { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .team-btn {
    border: 2px solid transparent; border-radius: 8px; padding: 4px 4px 6px; cursor: pointer;
    font: 700 10px/1.1 Inter, sans-serif; letter-spacing: .04em; text-transform: uppercase;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .team-btn img { height: 30px; width: auto; display: block; }
  .team-btn[aria-pressed=true] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--bg) inset; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button.primary, button.ghost {
    font: 700 14px Inter, sans-serif; border-radius: 8px; padding: 10px 14px; cursor: pointer; border: 0;
  }
  button.primary { background: var(--accent); color: #1b1530; flex: 1; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost:hover { background: var(--panel-2); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0 4px; }
  .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .msg { font-size: 12px; margin-top: 8px; min-height: 1em; color: var(--accent); }
  .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; font-size: 13px; }
  .opts label { all: unset; display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .count { font-weight: 700; color: var(--accent); }

  main { padding: 28px; overflow-x: auto; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .toolbar h2 { margin: 0; font: 400 22px Abril Fatface, serif; letter-spacing: .02em; }
  .empty { color: var(--muted); border: 2px dashed var(--line); border-radius: 12px; padding: 40px; text-align: center; max-width: 210mm; }

  /* ---------- printable sheet ---------- */
  .sheet {
    width: 210mm; height: 297mm; background: var(--sheet); margin: 0 auto 28px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    display: grid; grid-template-columns: repeat(2, 3in); grid-auto-rows: 4in;
    justify-content: center; align-content: center; gap: 6mm;
    position: relative;
  }
  .tag-wrap { position: relative; }
  .tag-wrap .del {
    position: absolute; top: -10px; right: -10px; z-index: 3; width: 26px; height: 26px; border-radius: 50%;
    border: 0; background: #111; color: #fff; font: 700 14px Inter; cursor: pointer; opacity: 0; transition: opacity .15s;
  }
  .tag-wrap:hover .del { opacity: 1; }
  .cut .tag-wrap::before, .cut .tag-wrap::after {
    content: ""; position: absolute; inset: -3mm; pointer-events: none;
    background:
      linear-gradient(#999,#999) left 0 top 3mm / 2mm 0.2mm no-repeat,
      linear-gradient(#999,#999) left 3mm top 0 / 0.2mm 2mm no-repeat,
      linear-gradient(#999,#999) right 0 top 3mm / 2mm 0.2mm no-repeat,
      linear-gradient(#999,#999) right 3mm top 0 / 0.2mm 2mm no-repeat,
      linear-gradient(#999,#999) left 0 bottom 3mm / 2mm 0.2mm no-repeat,
      linear-gradient(#999,#999) left 3mm bottom 0 / 0.2mm 2mm no-repeat,
      linear-gradient(#999,#999) right 0 bottom 3mm / 2mm 0.2mm no-repeat,
      linear-gradient(#999,#999) right 3mm bottom 0 / 0.2mm 2mm no-repeat;
  }
  .cut .tag-wrap::after { display: none; }

  .tag {
    --c: #a11b24; --t: #fff;
    width: 3in; height: 4in; position: relative; overflow: hidden;
    background: var(--c); color: var(--t);
    display: flex; flex-direction: column; align-items: center;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .tag::before { /* halftone texture */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(0,0,0,.16) 0.55px, transparent 0.9px);
    background-size: 3.2px 3.2px;
  }
  .strip {
    width: 100%; height: .5in; flex: none; position: relative; z-index: 1;
    background-color: color-mix(in srgb, var(--c) 78%, #000);
    background-repeat: repeat-x; background-size: auto 84%; background-position: center;
  }
  .strip.top { border-bottom: 2px solid rgba(0,0,0,.25); }
  .strip.bottom {
    border-top: 2px solid rgba(0,0,0,.25); background-image: none !important;
    display: flex; align-items: center; justify-content: center;
    font: 400 12.5pt/1 "Abril Fatface", serif; letter-spacing: .06em;
  }
  .hole { position: absolute; top: .12in; left: 50%; transform: translateX(-50%); width: .62in; height: .14in;
    border-radius: 99px; background: rgba(255,255,255,.88); box-shadow: inset 0 1px 2px rgba(0,0,0,.4); z-index: 2; }
  .hero { position: relative; z-index: 1; height: 1.55in; width: 100%; margin-top: .12in; display: grid; place-items: center; flex: none; }
  .hero svg { position: absolute; height: 1.62in; width: 1.62in; }
  .hero img { position: relative; height: 1.3in; width: auto; max-width: 1.55in; object-fit: contain;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
  .name-box { position: relative; z-index: 1; flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 .16in; min-height: 0; }
  .name {
    font-family: "Abril Fatface", "Bodoni 72", Didot, serif; font-weight: 400;
    line-height: .95; text-align: center; white-space: nowrap; width: 100%;
    text-shadow: 0 2px 0 rgba(0,0,0,.22);
  }
  .team-label {
    margin-top: .07in; font: 400 11pt/1 "Abril Fatface", serif; letter-spacing: .1em;
    padding: .05in .14in; border-radius: 99px;
    background: color-mix(in srgb, var(--c) 72%, #000); color: var(--t);
  }

  @media screen and (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 16px; }
    .sheet { transform-origin: top left; }
  }
  @page { size: A4; margin: 0; }
  @media print {
    body { background: #fff; min-height: 0; }
    .app { min-height: 0; }
    aside, .toolbar, .del, .empty { display: none !important; }
    .app { display: block; }
    main { padding: 0; }
    .sheet { box-shadow: none; margin: 0; height: 296mm; overflow: hidden; break-after: page; }
    .sheet:last-child { break-after: auto; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Name Tags</h1>
    <p class="sub">LE'GO Dance Camp 2026 · matches the lanyards</p>

    <label for="name">Name</label>
    <input id="name" type="text" placeholder="e.g. Eason" autocomplete="off">

    <label>Team</label>
    <div class="teams" id="teams"></div>

    <div class="row">
      <button class="primary" id="add">Add tag</button>
    </div>
    <div class="msg" id="msg"></div>

    <hr>
    <label for="bulk">Bulk add: one per line, "Name, Team"</label>
    <textarea id="bulk" placeholder="Alice, Zombie&#10;Ben, Team Vampire&#10;Ms Chen, Teacher&#10;Jo, Exec"></textarea>
    <div class="row">
      <button class="ghost" id="bulkAdd" style="flex:1">Add all</button>
    </div>
    <p class="hint">You can type a team as "Zombie", "Team Zombie", "Teacher" or "Exec".</p>

    <hr>
    <label>Print</label>
    <div class="opts">
      <label><input type="checkbox" id="cut" checked> Show cut marks</label>
      <label><input type="checkbox" id="hole" checked> Show lanyard slot</label>
      <label><input type="checkbox" id="sort"> Group tags by team</label>
    </div>
    <div class="row">
      <button class="primary" id="print">Print</button>
      <button class="ghost" id="clear">Clear all</button>
    </div>
    <p class="hint">Each tag is 3 × 4 in, 4 to an A4 page. In the print dialog, turn on <b>Background graphics</b> and set the scale to 100%.</p>
  </aside>

  <main>
    <div class="toolbar">
      <h2>Print preview · <span class="count" id="count">0 tags</span></h2>
    </div>
    <div id="sheets"></div>
  </main>
</div>

const TEAMS = [
  { id: 'teacher',      label: 'TEACHER',           short: 'Teacher',   c: '#a11b24', t: '#ffffff' },
  { id: 'executive',    label: 'EXECUTIVE',         short: 'Exec',      c: '#c34c20', t: '#ffffff' },
  { id: 'witch',        label: 'TEAM WITCH',        short: 'Witch',     c: '#be701c', t: '#ffffff' },
  { id: 'werewolf',     label: 'TEAM WEREWOLF',     short: 'Werewolf',  c: '#cfb721', t: '#141414' },
  { id: 'zombie',       label: 'TEAM ZOMBIE',       short: 'Zombie',    c: '#96bd23', t: '#141414' },
  { id: 'frankenstein', label: 'TEAM FRANKENSTEIN', short: 'Franken.',  c: '#469c3a', t: '#ffffff' },
  { id: 'skull',        label: 'TEAM SKULL',        short: 'Skull',     c: '#38a093', t: '#ffffff' },
  { id: 'vampire',      label: 'TEAM VAMPIRE',      short: 'Vampire',   c: '#3b8cb0', t: '#ffffff' },
  { id: 'ghost',        label: 'TEAM GHOST',        short: 'Ghost',     c: '#223262', t: '#ffffff' },
  { id: 'cat',          label: 'TEAM CAT',          short: 'Cat',       c: '#412768', t: '#ffffff' },
  { id: 'mummy',        label: 'TEAM MUMMY',        short: 'Mummy',     c: '#8f1972', t: '#ffffff' },
  { id: 'alien',        label: 'TEAM ALIEN',        short: 'Alien',     c: '#b51874', t: '#ffffff' },
];
const byId = Object.fromEntries(TEAMS.map(t => [t.id, t]));
const PER_PAGE = 4;
const STORE = 'lego-nametags-v1';

let tags = load();
let current = 'zombie';

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

function load() {
  try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch { return []; }
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(tags)); } catch {}
}

function matchTeam(s) {
  const k = s.toLowerCase().replace(/[^a-z]/g, '').replace(/^team(?=[a-z])/, '');
  if (!k) return null;
  if (k.startsWith('exec')) return 'executive';
  if (k.startsWith('frank')) return 'frankenstein';
  if (k.startsWith('teach') || k === 'staff') return 'teacher';
  return TEAMS.find(t => t.id.startsWith(k) || k.startsWith(t.id))?.id || null;
}

function renderTeams() {
  $('#teams').innerHTML = TEAMS.map(t => `
    <button class="team-btn" data-id="${t.id}" aria-pressed="${t.id === current}"
      style="background:${t.c};color:${t.t}" title="${t.label}">
      <img src="${HEADS[t.id]}" alt="">${t.short}
    </button>`).join('');
}

const burst = (() => {
  const n = 14, pts = [];
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? 36 : 50, a = (Math.PI * i) / n - Math.PI / 2;
    pts.push((50 + r * Math.cos(a)).toFixed(1) + ',' + (50 + r * Math.sin(a)).toFixed(1));
  }
  return pts.join(' ');
})();

function tagHTML(tag, i) {
  const t = byId[tag.team];
  const head = HEADS[t.id];
  return `
  <div class="tag-wrap">
    <button class="del" data-i="${i}" title="Remove">×</button>
    <div class="tag" style="--c:${t.c};--t:${t.t}">
      <div class="strip top" style="background-image:url(${head})"></div>
      <div class="hole"></div>
      <div class="hero">
        <svg viewBox="0 0 100 100"><polygon points="${burst}" fill="color-mix(in srgb, ${t.c} 55%, #fff)" stroke="rgba(0,0,0,.25)" stroke-width="1.2"/></svg>
        <img src="${head}" alt="">
      </div>
      <div class="name-box">
        <div class="name">${esc(tag.name)}</div>
        <div class="team-label">${t.label}</div>
      </div>
      <div class="strip bottom">LE'GO DANCE CAMP 2026</div>
    </div>
  </div>`;
}

function render() {
  const list = tags.map((t, i) => [t, i]);
  if ($('#sort').checked) list.sort((a, b) => TEAMS.indexOf(byId[a[0].team]) - TEAMS.indexOf(byId[b[0].team]));
  $('#count').textContent = `${tags.length} tag${tags.length === 1 ? '' : 's'} · ${Math.ceil(tags.length / PER_PAGE)} page${Math.ceil(tags.length / PER_PAGE) === 1 ? '' : 's'}`;
  if (!tags.length) {
    $('#sheets').innerHTML = `<div class="empty">Add a name to see the tag here.</div>`;
    return;
  }
  let html = '';
  for (let p = 0; p < list.length; p += PER_PAGE) {
    html += `<div class="sheet${$('#cut').checked ? ' cut' : ''}">` +
      list.slice(p, p + PER_PAGE).map(([t, i]) => tagHTML(t, i)).join('') + `</div>`;
  }
  $('#sheets').innerHTML = html;
  document.querySelectorAll('.hole').forEach(h => h.style.display = $('#hole').checked ? '' : 'none');
  fitNames();
}

// Shrink each name until it fits; long names wrap onto two lines.
function fitNames() {
  document.querySelectorAll('.name').forEach(el => {
    const box = el.parentElement;
    const maxW = box.clientWidth - parseFloat(getComputedStyle(box).paddingLeft) * 2;
    let size = 54;
    el.style.whiteSpace = 'nowrap';
    el.style.fontSize = size + 'px';
    while (el.scrollWidth > maxW && size > 30) { size -= 1; el.style.fontSize = size + 'px'; }
    if (el.scrollWidth > maxW) {
      el.style.whiteSpace = 'normal';
      size = 40;
      el.style.fontSize = size + 'px';
      while ((el.scrollWidth > maxW || el.offsetHeight > 96) && size > 14) { size -= 1; el.style.fontSize = size + 'px'; }
    }
  });
}

function flash(text) {
  $('#msg').textContent = text;
  clearTimeout(flash.t);
  flash.t = setTimeout(() => $('#msg').textContent = '', 2500);
}

function addOne() {
  const name = $('#name').value.trim();
  if (!name) { $('#name').focus(); flash('Type a name first.'); return; }
  tags.push({ name, team: current });
  save(); render();
  $('#name').value = ''; $('#name').focus();
  flash(`Added ${name} (${byId[current].label})`);
}

$('#teams').addEventListener('click', e => {
  const b = e.target.closest('.team-btn'); if (!b) return;
  current = b.dataset.id; renderTeams(); $('#name').focus();
});
$('#add').onclick = addOne;
$('#name').addEventListener('keydown', e => { if (e.key === 'Enter') addOne(); });

$('#bulkAdd').onclick = () => {
  const bad = [];
  let n = 0;
  $('#bulk').value.split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
    const parts = line.split(/[,\t;]/);
    let name = parts[0].trim();
    let team = parts.length > 1 ? matchTeam(parts.slice(1).join(' ')) : current;
    // also accept "Team, Name" order (e.g. pasted straight from a spreadsheet)
    if (!team && parts.length > 1 && matchTeam(parts[0])) {
      team = matchTeam(parts[0]);
      name = parts.slice(1).join(' ').trim();
    }
    if (!name || !team) { bad.push(line); return; }
    tags.push({ name, team }); n++;
  });
  save(); render();
  $('#bulk').value = bad.join('\n');
  flash(bad.length ? `Added ${n}. Couldn't match the team on ${bad.length} line(s), so they're left in the box.` : `Added ${n} tags.`);
};

$('#sheets').addEventListener('click', e => {
  const b = e.target.closest('.del'); if (!b) return;
  tags.splice(+b.dataset.i, 1); save(); render();
});
$('#clear').onclick = () => { if (tags.length && confirm('Remove all tags?')) { tags = []; save(); render(); } };
$('#print').onclick = () => window.print();
['#cut', '#hole', '#sort'].forEach(s => $(s).addEventListener('change', render));

renderTeams();
render();
document.fonts?.ready.then(fitNames);
</script>
</body>
</html>
